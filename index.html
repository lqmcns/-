<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>多端消息互传</title>
    <style>
        :root {
            --bg: #101214;
            --surface: #191C21;
            --surface-2: #22262D;
            --border: #2C313A;
            --text: #E6E9ED;
            --text-2: #8B95A1;
            --accent: #5B9BFF;
            --accent-dim: rgba(91, 155, 255, 0.14);
            --green: #3FA871;
            --green-dim: rgba(63, 168, 113, 0.14);
            --red: #E05252;
            --red-dim: rgba(224, 82, 82, 0.14);
            --teal: #2FA8A0;
            --teal-dim: rgba(47, 168, 160, 0.14);
            --purple: #A37BE0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            margin: 0;
            overflow-x: hidden;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-mark {
            width: 8px;
            height: 20px;
            border-radius: 2px;
            background: var(--accent);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 16px;
            max-width: 720px;
            margin: 0 auto;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .card-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
        }

        .card-body {
            padding: 16px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            color: var(--text);
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        textarea::placeholder { color: var(--text-2); }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: filter 0.15s, transform 0.1s;
            min-height: 38px;
        }

        .btn:active { transform: scale(0.98); }
        .btn:hover { filter: brightness(1.12); }

        .btn-primary { background: var(--accent); color: #0E1114; }
        .btn-success { background: var(--green); color: #0E1114; }
        .btn-danger { background: var(--red); color: #FFFFFF; }
        .btn-info { background: var(--teal); color: #0E1114; }

        .btn-ghost {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .status {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .status-success { background: var(--green-dim); color: #7BD8A6; }
        .status-error { background: var(--red-dim); color: #F09A9A; }
        .status-info { background: var(--accent-dim); color: #9CC0FF; }

        .file-upload { margin-top: 4px; }
        .file-input { display: none; }

        .file-label {
            display: inline-flex;
            align-items: center;
            padding: 9px 18px;
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: border-color 0.15s, filter 0.15s;
        }

        .file-label:hover { border-color: var(--accent); filter: brightness(1.15); }

        .file-info {
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-2);
            word-break: break-all;
        }

        .file-limit-hint {
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-2);
            opacity: 0.75;
        }

        .message-list {
            max-height: 440px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
        }

        .message-item {
            background: var(--surface);
            padding: 12px 14px;
            margin: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .message-item.file-message { border-left: 3px solid var(--green); }
        .message-item.image-message { border-left: 3px solid var(--accent); }
        .message-item.media-message { border-left: 3px solid var(--purple); }

        .message-time {
            font-size: 12px;
            color: var(--text-2);
            margin-bottom: 6px;
        }

        .message-content {
            font-size: 14px;
            color: var(--text);
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-file {
            font-size: 13px;
            color: var(--accent);
            margin-top: 6px;
            word-break: break-all;
        }

        .message-image {
            max-width: 100%;
            max-height: 200px;
            margin-top: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .message-image:hover { opacity: 0.85; }

        .message-media {
            max-width: 100%;
            margin-top: 8px;
            border-radius: 6px;
        }

        .empty-message {
            text-align: center;
            color: var(--text-2);
            padding: 40px 16px;
            font-size: 14px;
        }

        .image-preview {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: zoom-out;
        }

        .image-preview img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .image-preview.show { display: flex; }

        .storage-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .storage-item {
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .storage-label {
            font-size: 12px;
            color: var(--text-2);
            margin-bottom: 4px;
        }

        .storage-value {
            font-size: 18px;
            font-weight: 500;
            color: var(--accent);
        }

        .storage-usage {
            margin-top: 12px;
        }

        .storage-usage-bar {
            height: 6px;
            border-radius: 3px;
            background: var(--surface-2);
            overflow: hidden;
        }

        .storage-usage-fill {
            height: 100%;
            border-radius: 3px;
            background: var(--accent);
            transition: width 0.4s;
        }

        .storage-usage-text {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-2);
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 17px; }
            .card-body { padding: 12px; }
            .btn { padding: 7px 14px; font-size: 13px; }
            .message-list { max-height: 340px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-mark"></div>
            <h1>多端消息互传</h1>
        </div>
        <div class="content">
            <!-- 存储统计 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">存储统计</div>
                </div>
                <div class="card-body">
                    <div class="storage-info">
                        <div class="storage-item">
                            <div class="storage-label">消息总数</div>
                            <div class="storage-value" id="statTotal">--</div>
                        </div>
                        <div class="storage-item">
                            <div class="storage-label">图片</div>
                            <div class="storage-value" id="statImages">--</div>
                        </div>
                        <div class="storage-item">
                            <div class="storage-label">文件 / 音视频</div>
                            <div class="storage-value" id="statFiles">--</div>
                        </div>
                        <div class="storage-item">
                            <div class="storage-label">数据文件大小</div>
                            <div class="storage-value" id="statSize">--</div>
                        </div>
                        <div class="storage-item">
                            <div class="storage-label">预计还可存</div>
                            <div class="storage-value" id="statEstimate">--</div>
                        </div>
                    </div>
                    <div class="storage-usage">
                        <div class="storage-usage-bar">
                            <div class="storage-usage-fill" id="usageFill" style="width: 0%;"></div>
                        </div>
                        <div class="storage-usage-text" id="storageStatus">等待加载...</div>
                    </div>
                </div>
            </div>

            <!-- 消息列表 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">消息列表</div>
                </div>
                <div class="card-body">
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="loadMessages()">刷新消息</button>
                        <button class="btn btn-ghost" onclick="saveToLocal()">导出备份</button>
                    </div>
                    <div id="messageList" class="message-list">
                        <div class="empty-message">暂无消息，正在加载...</div>
                    </div>
                    <div id="readStatus"></div>
                </div>
            </div>

            <!-- 发送新消息 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">发送新消息</div>
                </div>
                <div class="card-body">
                    <textarea id="writeContent" placeholder="输入要发送的消息..."></textarea>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="writeToGitee()">发送消息</button>
                        <button class="btn btn-ghost" onclick="clearText()">清空内容</button>
                    </div>
                    <div id="writeStatus"></div>
                </div>
            </div>

            <!-- 上传文件 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">上传文件</div>
                </div>
                <div class="card-body">
                    <div class="file-upload">
                        <label class="file-label" for="fileInput">选择文件</label>
                        <input type="file" id="fileInput" class="file-input">
                        <div class="file-info" id="fileInfo">未选择文件</div>
                        <div class="file-limit-hint">支持任意格式（图片 / 音频 / 视频 / 文档 / 压缩包等），单文件最大 50 MB；受 Gitee 接口限制，实际建议小于 1 MB</div>
                        <button class="btn btn-primary" style="margin-top: 12px;" onclick="uploadFile()">上传文件</button>
                    </div>
                    <div id="fileStatus"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 图片预览层 -->
    <div id="imagePreview" class="image-preview" onclick="closeImagePreview()">
        <img id="previewImg" src="" alt="预览">
    </div>

    <script>
        const REPO_API = 'https://gitee.com/api/v5/repos/northsey/message/contents/%E6%B6%88%E6%81%AF%E5%AD%98%E5%82%A8.txt';
        const TOKEN = '192a9f9e315df8703850b28e3962d911';

        // 文件大小上限（50 MB）
        const MAX_FILE_SIZE = 50 * 1024 * 1024;

        // 仓库配额（Gitee 免费版按 1 GB 估算）
        const QUOTA_BYTES = 1024 * 1024 * 1024;

        // 是否为 iOS / iPadOS 设备（Safari 上 a[download] 不可用）
        const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        // 页面加载：只加载一次
        window.onload = function() {
            loadMessages();
        };

        // UTF-8 与 Base64 互转
        function utf8ToBase64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        function base64ToUtf8(base64) {
            return decodeURIComponent(escape(atob(base64)));
        }

        // 状态持久显示，不自动清空，由下一次操作更新
        function showStatus(elementId, message, type) {
            const status = document.getElementById(elementId);
            status.className = `status status-${type}`;
            status.textContent = message;
        }

        function formatFileSize(bytes) {
            if (bytes >= 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
            if (bytes >= 1024) return `${(bytes / 1024).toFixed(2)} KB`;
            return `${bytes} B`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        // 解析消息内容（兼容旧格式）
        function parseMessages(content) {
            const messages = [];
            const sections = content.split('========================================');

            for (let i = 0; i < sections.length; i++) {
                const section = sections[i].trim();
                if (!section) continue;

                const lines = section.split('\n');
                const currentMessage = { time: '', content: '', type: 'text', file: null, base64Data: null };

                for (let j = 0; j < lines.length; j++) {
                    const line = lines[j].trim();
                    if (!line) continue;

                    if (line.match(/^\d{4}-\d{2}-\d{2}/)) {
                        currentMessage.time = line;
                        continue;
                    }

                    if (line.startsWith('[图片]') || line.startsWith('[文件]')) {
                        currentMessage.type = line.startsWith('[图片]') ? 'image' : 'file';
                        currentMessage.file = line.replace(/^\[(图片|文件)\]\s*/, '');
                        continue;
                    }

                    if (line.startsWith('上传时间:')) {
                        currentMessage.time = line.replace('上传时间:', '').trim();
                        continue;
                    }

                    if (line.startsWith('大小:')) continue;

                    if (line === 'BASE64_DATA:') {
                        const base64Lines = [];
                        for (let k = j + 1; k < lines.length; k++) {
                            const base64Line = lines[k];
                            if (base64Line.trim() && !base64Line.startsWith('====')) {
                                base64Lines.push(base64Line);
                            } else {
                                break;
                            }
                        }
                        currentMessage.base64Data = base64Lines.join('');
                        break;
                    }

                    currentMessage.content += (currentMessage.content ? '\n' : '') + line;
                }

                if (currentMessage.time || currentMessage.content || currentMessage.base64Data) {
                    messages.push(currentMessage);
                }
            }

            return messages.reverse(); // 最新的在前面
        }

        // 根据文件名判断媒体类型
        function getMediaType(fileName) {
            const ext = (fileName || '').toLowerCase().split('.').pop();
            if (['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac'].includes(ext)) return 'audio';
            if (['mp4', 'webm', 'mov', 'avi', 'mkv', 'm4v', 'ogv'].includes(ext)) return 'video';
            return null;
        }

        // 渲染消息列表（所有事件按索引传参，避免把 base64 内联进 HTML）
        function renderMessages(messages) {
            const container = document.getElementById('messageList');
            window.messagesData = messages;

            if (messages.length === 0) {
                container.innerHTML = '<div class="empty-message">暂无消息</div>';
                return;
            }

            container.innerHTML = messages.map((msg, index) => {
                let itemClass = 'message-item';
                if (msg.type === 'image') itemClass += ' image-message';
                else if (msg.type === 'file' && getMediaType(msg.file)) itemClass += ' media-message';
                else if (msg.type === 'file') itemClass += ' file-message';

                let contentHtml = '';
                if (msg.content) {
                    contentHtml += `<div class="message-content">${escapeHtml(msg.content)}</div>`;
                }

                if (msg.type === 'image' && msg.base64Data) {
                    contentHtml += `
                        <img src="${msg.base64Data}" class="message-image" onclick="previewImageByIndex(${index})" alt="${escapeHtml(msg.file)}">
                        <div class="message-file">${escapeHtml(msg.file)}</div>
                        <div class="btn-group">
                            <button class="btn btn-success" style="padding: 6px 16px; font-size: 12px;" onclick="saveFileByIndex(${index})">保存图片</button>
                            <button class="btn btn-danger" style="padding: 6px 16px; font-size: 12px;" onclick="deleteMessage(${index})">删除</button>
                        </div>
                    `;
                } else if (msg.type === 'file' && msg.base64Data) {
                    const mediaType = getMediaType(msg.file);
                    let mediaHtml = '';
                    if (mediaType === 'audio') {
                        mediaHtml = `<audio controls class="message-media" src="${msg.base64Data}"></audio>`;
                    } else if (mediaType === 'video') {
                        mediaHtml = `<video controls class="message-media" style="max-height: 300px;" src="${msg.base64Data}"></video>`;
                    }
                    contentHtml += `
                        <div class="message-file">${escapeHtml(msg.file)}</div>
                        ${mediaHtml}
                        <div class="btn-group">
                            <button class="btn btn-success" style="padding: 6px 16px; font-size: 12px;" onclick="saveFileByIndex(${index})">保存文件</button>
                            <button class="btn btn-danger" style="padding: 6px 16px; font-size: 12px;" onclick="deleteMessage(${index})">删除</button>
                        </div>
                    `;
                } else if (msg.file) {
                    // 旧格式：只有文件名没有数据
                    contentHtml += `
                        <div class="message-file">${escapeHtml(msg.file)}</div>
                        <button class="btn btn-danger" style="margin-top: 8px; padding: 6px 16px; font-size: 12px;" onclick="deleteMessage(${index})">删除</button>
                    `;
                } else {
                    contentHtml += `
                        <div class="btn-group">
                            <button class="btn btn-success" style="padding: 6px 16px; font-size: 12px;" onclick="copyMessage(${index})">复制</button>
                            <button class="btn btn-danger" style="padding: 6px 16px; font-size: 12px;" onclick="deleteMessage(${index})">删除</button>
                        </div>
                    `;
                }

                return `
                    <div class="${itemClass}">
                        <div class="message-time">${escapeHtml(msg.time)}</div>
                        ${contentHtml}
                    </div>
                `;
            }).join('');
        }

        // 用真实消息文件数据更新存储统计和剩余可存估算
        function updateStorageStats(messages, rawContentLength) {
            let images = 0, files = 0;
            const mediaSizes = [];

            for (const msg of messages) {
                if (msg.type === 'image') {
                    images++;
                    if (msg.base64Data) mediaSizes.push(msg.base64Data.length * 3 / 4);
                } else if (msg.type === 'file') {
                    files++;
                    if (msg.base64Data) mediaSizes.push(msg.base64Data.length * 3 / 4);
                }
            }

            // 平均文件大小：优先用已存文件的真实平均值，无文件时按 200 KB 估算
            const avgSize = mediaSizes.length > 0
                ? mediaSizes.reduce((a, b) => a + b, 0) / mediaSizes.length
                : 200 * 1024;

            const usedBytes = rawContentLength;
            const remainingBytes = Math.max(0, QUOTA_BYTES - usedBytes);
            const estimatedCount = Math.floor(remainingBytes / avgSize);

            document.getElementById('statTotal').textContent = messages.length;
            document.getElementById('statImages').textContent = images;
            document.getElementById('statFiles').textContent = files;
            document.getElementById('statSize').textContent = formatFileSize(usedBytes);
            document.getElementById('statEstimate').textContent = `约 ${estimatedCount} 个`;

            const usagePercent = Math.min(100, usedBytes / QUOTA_BYTES * 100);
            document.getElementById('usageFill').style.width = `${usagePercent}%`;
            document.getElementById('storageStatus').textContent =
                `已用 ${usagePercent.toFixed(2)}%（配额按 1 GB 估算） · 均文件 ${formatFileSize(avgSize)}`;
        }

        // 预览图片（按索引取数据）
        function previewImageByIndex(index) {
            const msg = (window.messagesData || [])[index];
            if (!msg || !msg.base64Data) return;
            document.getElementById('previewImg').src = msg.base64Data;
            document.getElementById('imagePreview').classList.add('show');
        }

        function closeImagePreview() {
            document.getElementById('imagePreview').classList.remove('show');
        }

        // dataURL 转 Blob（同步，保证在用户手势上下文内完成）
        function dataUrlToBlob(dataUrl) {
            const parts = dataUrl.split(',');
            const mime = parts[0].match(/:(.*?);/)[1];
            const byteString = atob(parts[1]);
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mime });
        }

        // 跨平台保存文件：iOS 用分享面板/新标签长按保存，其他平台用 a[download]
        function saveBase64File(dataUrl, fileName) {
            try {
                const blob = dataUrlToBlob(dataUrl);

                // 优先使用 Web Share API（iOS Safari 分享面板里有"存储图像"）
                if (navigator.canShare && navigator.canShare({ files: [blob] })) {
                    navigator.share({ files: [blob] }).catch(() => {});
                    return;
                }

                // iOS 降级：新标签打开，长按图片选择"存储图像"
                if (IS_IOS) {
                    const url = URL.createObjectURL(blob);
                    const win = window.open(url, '_blank');
                    if (!win) {
                        window.location.href = url;
                    }
                    showToast('在新标签页中长按图片，选择"存储图像"', 'success');
                    setTimeout(() => URL.revokeObjectURL(url), 60000);
                    return;
                }

                // 标准下载路径
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
                showToast('文件已保存', 'success');
            } catch (error) {
                showToast('保存失败: ' + error.message, 'error');
                console.error(error);
            }
        }

        // 按索引保存图片/文件
        function saveFileByIndex(index) {
            const msg = (window.messagesData || [])[index];
            if (!msg || !msg.base64Data) {
                showToast('文件数据不存在', 'error');
                return;
            }
            saveBase64File(msg.base64Data, msg.file || 'file');
        }

        // Toast 提示
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                padding: 14px 22px;
                border-radius: 8px;
                background: #262B33;
                border: 1px solid #3A414C;
                color: ${type === 'success' ? '#7BD8A6' : '#F09A9A'};
                font-size: 14px;
                z-index: 9999;
                box-shadow: 0 8px 24px rgba(0,0,0,0.5);
                max-width: 80%;
                text-align: center;
            `;
            document.body.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 2200);
        }

        // 复制消息文本到剪贴板（含 iOS Safari 降级）
        function copyMessage(index) {
            const msg = (window.messagesData || [])[index];
            if (!msg || !msg.content) {
                showToast('消息不存在', 'error');
                return;
            }

            const text = msg.content;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('已复制到剪贴板', 'success');
                }).catch(() => {
                    fallbackCopyText(text);
                });
            } else {
                fallbackCopyText(text);
            }
        }

        // 剪贴板降级方案（execCommand，兼容 iOS Safari 与 file:// 场景）
        function fallbackCopyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.cssText = 'position: fixed; top: -9999px; left: -9999px; opacity: 0;';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                const ok = document.execCommand('copy');
                showToast(ok ? '已复制到剪贴板' : '复制失败，请手动选择文本复制', ok ? 'success' : 'error');
            } catch (e) {
                showToast('复制失败，请手动选择文本复制', 'error');
            }
            document.body.removeChild(textarea);
        }

        // 加载消息（同时更新存储统计，只发一次请求）
        async function loadMessages() {
            showStatus('readStatus', '正在加载...', 'info');

            try {
                const response = await fetch(REPO_API, {
                    headers: { 'Authorization': `token ${TOKEN}` }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                const content = base64ToUtf8(data.content.replace(/\n/g, ''));

                window.rawContent = content;
                const messages = parseMessages(content);
                renderMessages(messages);
                updateStorageStats(messages, content.length);

                showStatus('readStatus', `加载成功，共 ${messages.length} 条消息`, 'success');
            } catch (error) {
                showStatus('readStatus', `加载失败: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // 发送消息
        async function writeToGitee() {
            const content = document.getElementById('writeContent').value.trim();

            if (!content) {
                showStatus('writeStatus', '请输入消息内容', 'error');
                return;
            }

            showStatus('writeStatus', '正在发送...', 'info');

            try {
                let existingContent = '';
                let sha = '';
                try {
                    const checkResponse = await fetch(REPO_API, {
                        headers: { 'Authorization': `token ${TOKEN}` }
                    });
                    if (checkResponse.ok) {
                        const existing = await checkResponse.json();
                        existingContent = base64ToUtf8(existing.content.replace(/\n/g, ''));
                        sha = existing.sha;
                    }
                } catch (e) {
                    console.log('文件不存在，将创建新文件');
                }

                const timestamp = new Date().toLocaleString('zh-CN', { hour12: false });
                const newMessage = `\n\n========================================\n${timestamp}\n${content}\n`;
                const finalContent = existingContent + newMessage;

                const response = await fetch(REPO_API, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: '发送消息',
                        content: utf8ToBase64(finalContent),
                        sha: sha
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                showStatus('writeStatus', '发送成功', 'success');
                document.getElementById('writeContent').value = '';
                setTimeout(() => loadMessages(), 500);
            } catch (error) {
                showStatus('writeStatus', `发送失败: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // 导出原始数据备份
        function saveToLocal() {
            const content = window.rawContent || '';
            if (!content) {
                showStatus('readStatus', '请先加载消息', 'error');
                return;
            }

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `消息存储_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showStatus('readStatus', '已导出备份文件', 'success');
        }

        // 删除消息：用非空段落列表做映射，避免首段为空/非空导致的错删
        async function deleteMessage(index) {
            showConfirmDialog('确定要删除这条消息吗？', async () => {
                try {
                    const response = await fetch(REPO_API, {
                        headers: { 'Authorization': `token ${TOKEN}` }
                    });

                    if (!response.ok) {
                        throw new Error(`获取消息失败: HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    const existingContent = base64ToUtf8(data.content.replace(/\n/g, ''));

                    // 只保留非空段落，与 parseMessages 的展示顺序一一对应
                    const sectionList = existingContent.split('========================================').filter(s => s.trim() !== '');

                    if (index < 0 || index >= sectionList.length) {
                        throw new Error('消息索引无效，请刷新后重试');
                    }

                    // 列表是倒序展示的，还原到实际位置
                    const actualIndex = sectionList.length - 1 - index;
                    sectionList.splice(actualIndex, 1);

                    const newContent = sectionList.length > 0
                        ? sectionList.join('\n\n========================================\n') + '\n'
                        : ' ';

                    const updateResponse = await fetch(REPO_API, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: '删除消息',
                            content: utf8ToBase64(newContent),
                            sha: data.sha
                        })
                    });

                    if (!updateResponse.ok) {
                        throw new Error(`删除失败: HTTP ${updateResponse.status}`);
                    }

                    showToast('消息已删除', 'success');
                    setTimeout(() => loadMessages(), 500);
                } catch (error) {
                    showToast('删除失败: ' + error.message, 'error');
                    console.error(error);
                }
            });
        }

        // 自定义确认框
        function showConfirmDialog(message, onConfirm) {
            const dialog = document.createElement('div');
            dialog.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.6);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 9998;
            `;

            const content = document.createElement('div');
            content.style.cssText = `
                background: #1E2228;
                border: 1px solid #3A414C;
                padding: 24px;
                border-radius: 10px;
                max-width: 80%;
                text-align: center;
            `;

            const text = document.createElement('p');
            text.textContent = message;
            text.style.cssText = 'font-size: 15px; margin-bottom: 16px; color: #E6E9ED;';

            const buttons = document.createElement('div');
            buttons.style.cssText = 'display: flex; gap: 8px; justify-content: center;';

            const yesBtn = document.createElement('button');
            yesBtn.textContent = '确定';
            yesBtn.className = 'btn btn-danger';
            yesBtn.onclick = () => { dialog.remove(); onConfirm(); };

            const noBtn = document.createElement('button');
            noBtn.textContent = '取消';
            noBtn.className = 'btn btn-ghost';
            noBtn.onclick = () => { dialog.remove(); };

            buttons.appendChild(yesBtn);
            buttons.appendChild(noBtn);
            content.appendChild(text);
            content.appendChild(buttons);
            dialog.appendChild(content);
            document.body.appendChild(dialog);
        }

        function clearText() {
            document.getElementById('writeContent').value = '';
            showStatus('writeStatus', '已清空', 'success');
        }

        // 文件选择即时校验
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const fileInfo = document.getElementById('fileInfo');
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                if (file.size > MAX_FILE_SIZE) {
                    fileInfo.textContent = `${file.name} - ${formatFileSize(file.size)}（超过 50 MB 限制）`;
                    fileInfo.style.color = '#F09A9A';
                } else {
                    fileInfo.textContent = `${file.name} - ${formatFileSize(file.size)}`;
                    fileInfo.style.color = '';
                }
            } else {
                fileInfo.textContent = '未选择文件';
                fileInfo.style.color = '';
            }
        });

        // 上传文件（任意格式转 base64 存储）
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');

            if (!fileInput.files.length) {
                showStatus('fileStatus', '请选择文件', 'error');
                return;
            }

            const file = fileInput.files[0];

            if (file.size > MAX_FILE_SIZE) {
                showStatus('fileStatus', `文件过大：${formatFileSize(file.size)}，最大允许 50 MB`, 'error');
                return;
            }

            showStatus('fileStatus', `正在处理 ${file.name}（${formatFileSize(file.size)}）...`, 'info');

            try {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64Data = e.target.result; // data:<mime>;base64,xxx
                    const isImage = file.type.startsWith('image/');
                    const messageType = isImage ? '图片' : '文件';
                    const timestampStr = new Date().toLocaleString('zh-CN', { hour12: false });

                    const messageContent = `[${messageType}] ${file.name}\n上传时间: ${timestampStr}\n大小: ${formatFileSize(file.size)}\nBASE64_DATA:\n${base64Data}\n`;

                    try {
                        let existingContent = '';
                        let sha = '';

                        try {
                            const response = await fetch(REPO_API, {
                                headers: { 'Authorization': `token ${TOKEN}` }
                            });
                            if (response.ok) {
                                const data = await response.json();
                                existingContent = base64ToUtf8(data.content.replace(/\n/g, ''));
                                sha = data.sha;
                            }
                        } catch (e) {
                            console.log('消息文件不存在，将创建新文件');
                        }

                        const newContent = existingContent + '\n\n========================================\n' + messageContent;

                        const requestBody = {
                            message: '上传文件',
                            content: utf8ToBase64(newContent)
                        };
                        if (sha) requestBody.sha = sha;

                        const response = await fetch(REPO_API, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${TOKEN}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(requestBody)
                        });

                        if (!response.ok) {
                            const errorText = await response.text();
                            throw new Error(`HTTP ${response.status}: ${errorText}`);
                        }

                        showStatus('fileStatus', `${messageType}上传成功`, 'success');

                        fileInput.value = '';
                        document.getElementById('fileInfo').textContent = '未选择文件';

                        setTimeout(() => loadMessages(), 500);
                    } catch (error) {
                        showStatus('fileStatus', `上传失败: ${error.message}`, 'error');
                        console.error(error);
                    }
                };
                reader.readAsDataURL(file);
            } catch (error) {
                showStatus('fileStatus', `读取文件失败: ${error.message}`, 'error');
                console.error(error);
            }
        }
    </script>
</body>
